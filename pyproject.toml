[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "yeti-python-package"
description = "Bleeding edge cookiecutter template to create new python packages"
version = "0.1.0"
readme = "README.md"
authors = [
  "Nikita Sobolev <mail@sobolevn.me>",
  "Anatoly Scherbakov <altaisoft@gmail.com>"
]

license = "MIT"


[tool.poetry.dependencies]
python = ">=3.7,<4.0"

cookiecutter = ">=1.7,<3.0"
jinja2-git = "^1.1"
lice = "^0.6"


[tool.poetry.dev-dependencies]
binaryornot = "^0.4"

wemake-python-styleguide = "^0.16"
flake8-pytest-style = "^1.6"
nitpick = "^0.32"

pytest = "^7.2"
pytest-randomly = "^3.11"
pytest-cookies = "^0.6"

safety = "^1.10"
tomlkit = "^0.10"
